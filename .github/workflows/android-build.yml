name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'app/**', 'App.js', 'app.json', 'package.json', '.github/workflows/android-build.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --console=plain

      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mymindcoach-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mymindcoach-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
