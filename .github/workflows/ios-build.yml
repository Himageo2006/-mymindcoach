name: Build & Submit iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS locally (no cloud credits used)
        run: eas build --platform ios --profile production --local --non-interactive --output build.ipa

      - name: Submit to App Store Connect
        run: eas submit --platform ios --path build.ipa --non-interactive
