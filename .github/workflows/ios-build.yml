name: Build & Submit iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Cloud build on EAS (Expo's macOS infra) + auto-submit to App Store Connect.
      # The local (--local) path failed building the ExpoModulesJSI xcframework on the
      # GitHub macOS runner; EAS Cloud uses a controlled toolchain that builds this stack.
      - name: Build & submit iOS on EAS Cloud
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile production --non-interactive --auto-submit
