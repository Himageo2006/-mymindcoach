<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 500px; overflow: hidden; }
  .banner {
    width: 1024px;
    height: 500px;
    background: linear-gradient(135deg, #6C63FF 0%, #3B35CC 50%, #1a1060 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 60px 80px;
    font-family: 'Segoe UI', Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }
  /* Background circles */
  .circle1 {
    position: absolute; width: 300px; height: 300px;
    border-radius: 50%; background: rgba(255,255,255,0.05);
    top: -80px; right: -80px;
  }
  .circle2 {
    position: absolute; width: 200px; height: 200px;
    border-radius: 50%; background: rgba(255,255,255,0.05);
    bottom: -60px; left: 300px;
  }
  .circle3 {
    position: absolute; width: 150px; height: 150px;
    border-radius: 50%; background: rgba(255,255,255,0.04);
    top: 50px; right: 300px;
  }
  .left { z-index: 1; }
  .tagline {
    color: rgba(255,255,255,0.75);
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .title {
    color: #ffffff;
    font-size: 64px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 24px;
  }
  .title span { color: #B8B0FF; }
  .subtitle {
    color: rgba(255,255,255,0.8);
    font-size: 20px;
    max-width: 480px;
    line-height: 1.5;
  }
  .right { z-index: 1; text-align: center; }
  .brain {
    font-size: 120px;
    line-height: 1;
    filter: drop-shadow(0 0 30px rgba(184,176,255,0.5));
  }
  .badges {
    display: flex;
    gap: 12px;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .badge {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 6px 16px;
    color: white;
    font-size: 14px;
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>
<div class="banner">
  <div class="circle1"></div>
  <div class="circle2"></div>
  <div class="circle3"></div>
  <div class="left">
    <div class="tagline">AI Mental Wellness</div>
    <div class="title">My<span>Mind</span><br>Coach</div>
    <div class="subtitle">Your personal AI coach for mental wellness — available 24/7 in your language</div>
    <div class="badges">
      <div class="badge">🌍 20+ Languages</div>
      <div class="badge">🧠 AI Therapist</div>
      <div class="badge">🔒 Private</div>
    </div>
  </div>
  <div class="right">
    <div class="brain">🧠</div>
  </div>
</div>
</body>
</html>
